<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120d0a" />
    <title>Gran Quispe</title>
    <meta name="description" content="El juego de dados y faroleo de las cantinas del Cusco. Canta, miente y desconfía, pero que no te pillen." />

         real, porque WhatsApp y las redes solo aceptan la imagen con su URL completa. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gran Quispe" />
    <meta property="og:description" content="El juego de dados y faroleo de las cantinas del Cusco. Canta, miente y desconfía." />
    <meta property="og:image" content="__SITE_URL__/compartir.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/src/assets/images/shared/icono.png" />
    <link rel="apple-touch-icon" href="/src/assets/images/shared/icono-apple.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bevan&family=Patua+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <!-- Canvas de Phaser (motor visual) -->
    <div id="game"></div>
    <!-- Capa HTML/CSS por encima del canvas (menú, panel de reglas, pásale el celular) -->
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
